name: lint-os

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the Engineering OS against its own contracts
        run: python tools/lint-os.py
      - name: Verify the skill installer runs
        run: |
          sh tools/install.sh --project "$RUNNER_TEMP/proj"
          test -f "$RUNNER_TEMP/proj/.claude/skills/eng-os-core/SKILL.md"
          test -f "$HOME/.claude/skills/eng-os-coding-standards-common/SKILL.md"
